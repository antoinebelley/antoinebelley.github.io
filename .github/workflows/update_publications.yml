name: Update Publications

on:
  schedule:
    # Runs at 00:05 (midnight) every Sunday (UTC)
    - cron: '5 0 * * 0'
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    # Grants write permission so the workflow can commit files back to your repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Speeds up subsequent runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        run: python pubfromInspire.py # Ensure this matches your script's filename

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          git add _publications/
          
          # Only commit and push if new files were created or modified
          if git diff --cached --quiet; then
            echo "No changes detected in publications. Skipping commit."
          else
            git commit -m "Automated update of publications from InspireHEP"
            git push
          fi
